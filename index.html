<!doctype html>
<html>

<head>
    <title>User Form</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        input.error {
            border: 2px solid red;
        }
    </style>

</head>

<body class="container mt-4">

    <h3 id="formTop">User Form</h3>

    <div class="mb-3">
        <label>Name</label>
        <input type="text" id="name" class="form-control" onblur="validateField(this)" data-required="true"
            data-validation="Please enter name" data-regex="nameRegex"
            data-regex-validation="Name cannot contain numbers" placeholder="Enter Name">

        <small class="text-danger error"></small>
    </div>


    <div class="mb-3">
        <label>Website</label>
        <input type="text" id="website" class="form-control" onblur="validateField(this)" data-required="true"
            data-validation="Please enter website" data-regex="urlRegex" data-regex-validation="Enter valid website"
            placeholder="Enter Website">

        <small class="text-danger error"></small>
    </div>


    <label>Address</label>

    <div class="row mb-3">

        <div class="col">
            <input type="text" id="street" class="form-control"                placeholder="Street">
            <small class="text-denger error"></small>
        </div>

        <div class="col">
            <input type="text" id="suite" class="form-control"
                placeholder="Suite">
            <small class="text-denger error"></small>

        </div>

        <div class="col">
            <input type="text" id="city" class="form-control" onblur="validateField(this)" data-required="true"
                data-validation="Please enter City"
                placeholder="City">
            <small class="text-danger error"></small>
        </div>

        <div class="col">
            <input type="number" id="zipcode" class="form-control" onblur="validateField(this)" data-required="true"
                data-validation="Please enter Zipcode" maxlength="999999" minlength="100000"
                placeholder="Zipcode">
            <small class="text-danger error"></small>
        </div>

    </div>


    <label>Company</label>

    <div class="row mb-3">

        <div class="col">
            <input type="text" id="companyName" class="form-control" onblur="validateField(this)" data-required="true"
                data-validation="Please enter Company Name" placeholder="Company Name">
            <small class="text-danger error"></small>
        </div>

        <div class="col">
            <input type="text" id="bs" class="form-control" onblur="validateField(this)" data-required="true"
                data-validation="Please enter BS" 
                placeholder="BS">
            <small class="text-denger error"></small>
        </div>

        <div class="col">
            <input type="text" id="catchPhrase" class="form-control" onblur="validateField(this)" data-required="true"
                data-validation="Please enter Catch Phrase" placeholder="Catch Phrase">
            <small class="text-denger error"></small>
        </div>

    </div>


    <div class="mb-3">
        <label>Email</label>

        <input type="text" id="email" class="form-control" onblur="validateField(this)" data-required="true"
            data-validation="Please enter email" data-regex="emailRegex" data-regex-validation="Enter valid email"
            placeholder="Enter Email">

        <small class="text-danger error"></small>

    </div>


    <div class="mb-3">
        <label>Phone</label>

        <input type="text" id="phone" class="form-control" onblur="validateField(this)" data-required="true"
            data-validation="Please enter phone" data-regex="phoneRegex" data-regex-validation="Phone must be 10 digits"
            placeholder="Enter Phone">

        <small class="text-danger error"></small>

    </div>


    <button id="btnSave" class="btn btn-primary">Save</button>

    <hr>

    <h4>User List</h4>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Website</th>
                <th>Address</th>
                <th>Company</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="userTable"></tbody>

    </table>


    <script src="script.js"></script>

</body>

</html>
