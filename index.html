<!doctype html>
<html>

<head>
    <title>User Form</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        .error::placeholder {
            color: red;
        }

        input.error {
            border: 2px solid red;
        }
    </style>

</head>

<body class="container mt-4">

    <h3>User Form</h3>

    <div class="mb-3">
        <label>Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter Name">
        <small id="nameError" class="text-danger"></small>
    </div>

    <div class="mb-3">
        <label>Website</label>
        <input type="text" id="website" class="form-control" placeholder="Enter Website">
    </div>

    <!-- Address -->

    <div class="mb-3">

        <label>Address</label>

        <div class="row">

            <div class="col">
                <input type="text" id="street" class="form-control" placeholder="Street">
            </div>

            <div class="col">
                <input type="text" id="suite" class="form-control" placeholder="Suite">
            </div>

            <div class="col">
                <input type="text" id="city" class="form-control" placeholder="City">
            </div>

            <div class="col">
                <input type="text" id="zipcode" class="form-control" placeholder="Zipcode">
            </div>

        </div>
    </div>

    <!-- Company -->

    <div class="mb-3">

        <label>Company</label>

        <div class="row">

            <div class="col">
                <input type="text" id="companyName" class="form-control" placeholder="Company Name">
            </div>

            <div class="col">
                <input type="text" id="bs" class="form-control" placeholder="BS">
            </div>

            <div class="col">
                <input type="text" id="catchPhrase" class="form-control" placeholder="Catch Phrase">
            </div>

        </div>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter Email">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text" id="phone" class="form-control" placeholder="Enter Phone">
    </div>

    <button id="btnSave" class="btn btn-primary">Save</button>

    <hr>

    <h4>User List</h4>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Website</th>
                <th>Address</th>
                <th>Company</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>

    </table>

    <script src="script.js"></script>

</body>

</html>
